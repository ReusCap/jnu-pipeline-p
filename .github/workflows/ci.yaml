# .github/workflows/ci.yml

name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: Python 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: 패키지 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: pytest 실행 (단위 테스트)
      run: |
        python -m pytest tests/